<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidGaming</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
    background:#0f1326;
    color:white;
}

nav{
    position:sticky;
    top:0;
    z-index:100;
    height:70px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171c35;
    border-bottom:2px solid #292f50;
}

.logo{
    font-size:28px;
    font-weight:900;
    color:#7c5cff;
    cursor:pointer;
}
.logo span{color:#ffcc4d}

.navlinks{
    display:flex;
    gap:5px;
}

.navlinks button{
    background:none;
    border:0;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.navlinks button:hover{
    background:#292f50;
}

.user-button{
    background:#292f50;
    color:white;
    border:0;
    padding:11px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:90px 20px;
    background:
    radial-gradient(circle at 20% 20%,#6d4aff55,transparent 30%),
    radial-gradient(circle at 80% 20%,#ff4f9a44,transparent 30%),
    linear-gradient(135deg,#171c35,#0f1326);
}

.hero h1{
    font-size:60px;
    margin-bottom:15px;
}

.hero h1 span{color:#7c5cff}

.hero p{
    color:#b8bfdc;
    font-size:19px;
    max-width:650px;
    margin:auto;
    line-height:1.5;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    padding:14px 22px;
    border-radius:13px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#7c5cff;
    color:white;
}

.secondary{
    background:#292f50;
    color:white;
}

section{
    padding:60px 7%;
}

.section-title{
    font-size:35px;
    margin-bottom:25px;
}

.search{
    width:100%;
    max-width:600px;
    padding:15px;
    border-radius:13px;
    border:2px solid #30385f;
    background:#171c35;
    color:white;
    outline:none;
    margin-bottom:25px;
}

.posts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:20px;
}

.post-card{
    background:#191f3a;
    border:2px solid #2c3458;
    border-radius:18px;
    overflow:hidden;
}

.post-video{
    width:100%;
    max-height:300px;
    display:block;
    background:#000;
}

.post-content{
    padding:20px;
}

.post-content h3{
    margin-bottom:8px;
}

.meta{
    color:#aeb5d1;
    font-size:14px;
    line-height:1.6;
}

.description{
    color:#c1c7df;
    margin:15px 0;
    line-height:1.4;
}

.post-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.like-btn{
    background:#292f50;
    color:white;
    border:0;
    border-radius:10px;
    padding:9px 13px;
    cursor:pointer;
}

.channel{
    background:#151a31;
}

.channel-header{
    background:#191f3a;
    border:2px solid #2c3458;
    border-radius:20px;
    padding:30px;
    display:flex;
    align-items:center;
    gap:20px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:linear-gradient(135deg,#7c5cff,#ff4f9a);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
}

.modal{
    background:#191f3a;
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow:auto;
    border:2px solid #3a4270;
    border-radius:20px;
    padding:28px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:22px;
    color:#aaa;
}

.input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:2px solid #30385f;
    background:#0f1326;
    color:white;
    outline:none;
    margin:7px 0;
}

textarea.input{
    min-height:120px;
    resize:vertical;
}

label{
    display:block;
    color:#c0c6dd;
    font-size:14px;
    margin-top:10px;
}

.file-input{
    width:100%;
    padding:12px;
    background:#0f1326;
    border:2px dashed #4a5279;
    border-radius:10px;
    color:#cbd1e5;
    margin-top:7px;
}

.preview{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:12px;
    margin-top:12px;
    display:none;
}

.empty{
    text-align:center;
    padding:45px;
    background:#191f3a;
    border-radius:18px;
    border:2px dashed #30385f;
    color:#929aba;
}

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#7c5cff;
    padding:15px 20px;
    border-radius:13px;
    font-weight:bold;
    display:none;
    z-index:1000;
}

@media(max-width:800px){
    .navlinks{display:none}
    .hero h1{font-size:42px}
    .channel-header{
        flex-direction:column;
        text-align:center;
    }
}
</style>
</head>

<body>

<nav>

<div class="logo" onclick="home()">
Kid<span>Gaming</span> 🎮
</div>

<div class="navlinks">
<button onclick="home()">Home</button>
<button onclick="latest()">Latest</button>
<button onclick="myChannel()">My Channel</button>
<button onclick="openPost()">+ Create</button>
</div>

<button id="loginBtn" class="user-button" onclick="openLogin()">
Login
</button>

</nav>


<header class="hero" id="home">

<h1>
Welcome to <span>KidGaming</span> 🎮
</h1>

<p>
Watch gameplay, create your own channel and share your gaming moments.
</p>

<div class="buttons">

<button class="btn primary" onclick="openPost()">
🎥 Upload Gameplay
</button>

<button class="btn secondary" onclick="latest()">
🔥 Explore Gameplay
</button>

</div>

</header>


<section id="latest">

<h2 class="section-title">
🔥 Latest Gameplay
</h2>

<input
id="search"
class="search"
placeholder="Search game, category, title or user..."
oninput="searchPosts()"
>

<div id="posts" class="posts"></div>

</section>


<section class="channel" id="channel">

<h2 class="section-title">
📺 My Channel
</h2>

<div class="channel-header">

<div class="avatar">🎮</div>

<div>
<h2 id="channelName">Guest Channel</h2>
<p id="channelDescription" style="color:#aeb5d1;margin-top:8px">
Login to create your channel.
</p>
</div>

</div>

<br>

<div id="channelPosts" class="posts"></div>

</section>


<footer style="text-align:center;padding:40px;color:#858eaf">
🎮 KidGaming
<br><br>
Create • Play • Share
</footer>


<!-- LOGIN -->

<div id="loginModal" class="modal-bg">

<div class="modal">

<span class="close" onclick="closeModal('loginModal')">✕</span>

<h2>👤 Login / Create Account</h2>

<label>Username</label>

<input
id="username"
class="input"
placeholder="Your username"
maxlength="20"
>

<label>Password</label>

<input
id="password"
class="input"
type="password"
placeholder="Your password"
>

<button
class="btn primary"
style="width:100%;margin-top:12px"
onclick="login()">
Login
</button>

<button
class="btn secondary"
style="width:100%;margin-top:10px"
onclick="createAccount()">
Create Account
</button>

</div>

</div>


<!-- CREATE GAMEPLAY -->

<div id="postModal" class="modal-bg">

<div class="modal">

<span class="close" onclick="closeModal('postModal')">✕</span>

<h2>🎥 Upload Gameplay</h2>

<label>Title</label>

<input
id="title"
class="input"
placeholder="My awesome gameplay"
maxlength="80"
>

<label>Game</label>

<input
id="game"
class="input"
placeholder="Write the game name"
maxlength="40"
>

<label>Category</label>

<input
id="category"
class="input"
placeholder="Battle Royale, Racing, Survival..."
maxlength="40"
>

<label>Description</label>

<textarea
id="description"
class="input"
placeholder="Tell people about your gameplay..."
maxlength="300"
></textarea>

<label>🎥 Video</label>

<input
id="video"
class="file-input"
type="file"
accept="video/*"
onchange="previewVideo()"
>

<video
id="videoPreview"
class="preview"
controls>
</video>

<label>🖼️ Thumbnail</label>

<input
id="thumbnail"
class="file-input"
type="file"
accept="image/*"
onchange="previewThumbnail()"
>

<img
id="thumbnailPreview"
class="preview"
>

<button
class="btn primary"
style="width:100%;margin-top:18px"
onclick="createGameplay()">
🚀 POST GAMEPLAY
</button>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

let currentUser =
localStorage.getItem("kidgamingUser");

let posts =
JSON.parse(
localStorage.getItem("kidgamingPosts") || "[]"
);


/* USER */

function updateUser(){

const btn =
document.getElementById("loginBtn");

if(currentUser){

btn.innerText="👤 "+currentUser;

btn.onclick=()=>{

myChannel();

};

document.getElementById("channelName")
.innerText=currentUser+"'s Channel";

document.getElementById("channelDescription")
.innerText=
"Gaming channel by "+currentUser;

}else{

btn.innerText="Login";
btn.onclick=openLogin;

}

}

updateUser();
renderPosts();


/* LOGIN */

function openLogin(){

document.getElementById("loginModal")
.style.display="flex";

}

function login(){

let username=
document.getElementById("username").value.trim();

let password=
document.getElementById("password").value;

if(!username||!password){

toast("Enter username and password!");

return;

}

let account=
localStorage.getItem("account_"+username);

if(!account){

toast("Account not found!");

return;

}

account=JSON.parse(account);

if(account.password!==password){

toast("Wrong password!");

return;

}

currentUser=username;

localStorage.setItem(
"kidgamingUser",
username
);

closeModal("loginModal");

updateUser();

toast("Welcome "+username+"! 🎮");

}


function createAccount(){

let username=
document.getElementById("username").value.trim();

let password=
document.getElementById("password").value;

if(username.length<3||!password){

toast("Choose a username and password!");

return;

}

if(localStorage.getItem("account_"+username)){

toast("Username already exists!");

return;

}

localStorage.setItem(
"account_"+username,
JSON.stringify({
username:username,
password:password
})
);

currentUser=username;

localStorage.setItem(
"kidgamingUser",
username
);

closeModal("loginModal");

updateUser();

toast("Account created! 🎉");

}


/* UPLOAD */

function openPost(){

if(!currentUser){

toast("Login first!");

openLogin();

return;

}

document.getElementById("postModal")
.style.display="flex";

}


/* VIDEO PREVIEW */

function previewVideo(){

const file=
document.getElementById("video").files[0];

if(!file)return;

const preview=
document.getElementById("videoPreview");

preview.src=
URL.createObjectURL(file);

preview.style.display="block";

}


/* THUMBNAIL PREVIEW */

function previewThumbnail(){

const file=
document.getElementById("thumbnail").files[0];

if(!file)return;

const preview=
document.getElementById("thumbnailPreview");

preview.src=
URL.createObjectURL(file);

preview.style.display="block";

}


/* CREATE POST */

function createGameplay(){

const title=
document.getElementById("title").value.trim();

const game=
document.getElementById("game").value.trim();

const category=
document.getElementById("category").value.trim();

const description=
document.getElementById("description").value.trim();

const videoFile=
document.getElementById("video").files[0];

const thumbnailFile=
document.getElementById("thumbnail").files[0];


if(!title||!game||!category||!description){

toast("Fill in all fields!");

return;

}

if(!videoFile){

toast("Choose a video!");

return;

}


/*
IMPORTANT:
The video is stored as a temporary browser URL.
*/

const videoURL=
URL.createObjectURL(videoFile);

let thumbnailURL="";

if(thumbnailFile){

thumbnailURL=
URL.createObjectURL(thumbnailFile);

}


const post={

id:Date.now(),

author:currentUser,

title:title,

game:game,

category:category,

description:description,

video:videoURL,

thumbnail:thumbnailURL,

likes:0,

date:new Date().toLocaleDateString()

};


posts.unshift(post);

try{

localStorage.setItem(
"kidgamingPosts",
JSON.stringify(posts)
);

}catch(e){

toast("Video is too large for browser storage!");

return;

}

renderPosts();

renderChannel();

closeModal("postModal");

clearForm();

toast("Gameplay posted! 🎥🔥");

}


/* POSTS */

function renderPosts(){

const container=
document.getElementById("posts");

if(posts.length===0){

container.innerHTML=`

<div class="empty">

<h2>No gameplay yet 🎮</h2>

<p style="margin-top:10px">
Be the first to upload a gameplay!
</p>

</div>

`;

return;

}

container.innerHTML=
posts.map(postHTML).join("");

}


function postHTML(post){

return `

<div class="post-card">

${
post.thumbnail
?
`<video
class="post-video"
controls
poster="${post.thumbnail}"
src="${post.video}">
</video>`
:
`<video
class="post-video"
controls
src="${post.video}">
</video>`
}

<div class="post-content">

<h3>
${escapeHTML(post.title)}
</h3>

<div class="meta">

🎮 ${escapeHTML(post.game)}
<br>

🏷️ ${escapeHTML(post.category)}
<br>

👤 ${escapeHTML(post.author)}
<br>

📅 ${escapeHTML(post.date)}

</div>

<p class="description">
${escapeHTML(post.description)}
</p>

<div class="post-actions">

<button
class="like-btn"
onclick="likePost(${post.id})">
❤️ ${post.likes}
</button>

<span style="color:#858eaf">
Gameplay
</span>

</div>

</div>

</div>

`;

}


function likePost(id){

let post=
posts.find(p=>p.id===id);

if(!post)return;

post.likes++;

savePosts();

renderPosts();

renderChannel();

}


/* SEARCH */

function searchPosts(){

let q=
document.getElementById("search")
.value
.toLowerCase();

let filtered=
posts.filter(post=>

post.title.toLowerCase().includes(q)||
post.game.toLowerCase().includes(q)||
post.category.toLowerCase().includes(q)||
post.author.toLowerCase().includes(q)

);

document.getElementById("posts")
.innerHTML=
filtered.length
?
filtered.map(postHTML).join("")
:
`<div class="empty">
<h2>No results 🔎</h2>
</div>`;

}


/* CHANNEL */

function myChannel(){

document.getElementById("channel")
.scrollIntoView({
behavior:"smooth"
});

renderChannel();

}


function renderChannel(){

const container=
document.getElementById("channelPosts");

if(!currentUser){

container.innerHTML=`

<div class="empty">

<h2>Login to see your channel 👤</h2>

</div>

`;

return;

}

let mine=
posts.filter(
p=>p.author===currentUser
);

if(mine.length===0){

container.innerHTML=`

<div class="empty">

<h2>Your channel is empty 🎮</h2>

<p style="margin-top:10px">
Upload your first gameplay!
</p>

</div>

`;

return;

}

container.innerHTML=
mine.map(postHTML).join("");

}


/* NAVIGATION */

function home(){

document.getElementById("home")
.scrollIntoView({
behavior:"smooth"
});

}

function latest(){

document.getElementById("latest")
.scrollIntoView({
behavior:"smooth"
});

}


/* SAVE */

function savePosts(){

try{

localStorage.setItem(
"kidgamingPosts",
JSON.stringify(posts)
);

}catch(e){}

}


/* CLEAR */

function clearForm(){

document.getElementById("title").value="";
document.getElementById("game").value="";
document.getElementById("category").value="";
document.getElementById("description").value="";
document.getElementById("video").value="";
document.getElementById("thumbnail").value="";

document.getElementById("videoPreview").style.display="none";
document.getElementById("thumbnailPreview").style.display="none";

}


/* MODAL */

function closeModal(id){

document.getElementById(id)
.style.display="none";

}


/* TOAST */

function toast(text){

const t=
document.getElementById("toast");

t.innerText=text;
t.style.display="block";

setTimeout(()=>{

t.style.display="none";

},2500);

}


/* ESCAPE HTML */

function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>

</body>
</html>
