<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KidGaming - YouTube Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      color: #ff3b3b;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    h2 {
      margin-top: 25px;
    }

    .info {
      background: #181818;
      padding: 20px;
      border-radius: 14px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff5555;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 KidGaming</h1>
  </header>

  <main>

    <h2>▶️ YouTube Test</h2>

    <div class="video-box">
      <iframe
        id="youtubePlayer"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <div class="info">
      <h2>Schimbă videoclipul</h2>

      <p>
        Pune ID-ul unui videoclip YouTube.
      </p>

      <p>
        Exemplu: dacă linkul este
        <b>youtube.com/watch?v=ABC123</b>,
        ID-ul este <b>ABC123</b>.
      </p>

      <input
        id="videoId"
        placeholder="ID-ul videoclipului YouTube">

      <button onclick="changeVideo()">
        ▶️ Încarcă videoclipul
      </button>
    </div>

  </main>

  <script>
    function changeVideo() {

      const id = document.getElementById("videoId").value.trim();

      if (!id) {
        alert("Pune ID-ul videoclipului YouTube!");
        return;
      }

      document.getElementById("youtubePlayer").src =
        "https://www.youtube.com/embed/" + id;
    }
  </script>

</body>
</html>
